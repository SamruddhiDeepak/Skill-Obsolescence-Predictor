<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Obsolescence Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background: #fff;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .form-group {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    select, button {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background: #007bff;
      color: white;
      cursor: pointer;
      border: none;
      transition: 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    .report {
      margin-top: 30px;
      text-align: center;
    }

    .report img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 20px;
    }

    .loading {
      text-align: center;
      color: #555;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Skill Obsolescence Predictor</h1>

    <div class="form-group">
      <select id="skillSelect">
        <option value="React">React</option>
        <option value="Python">Python</option>
        <option value="jQuery">jQuery</option>
        <option value="TensorFlow">TensorFlow</option>
        <option value="Node.js">Node.js</option>
        <option value="Java">Java</option>
      </select>
      <button onclick="predictSkill()">Predict</button>
    </div>

    <div class="loading" id="loading" style="display:none;">Fetching data & generating forecast...</div>

    <div class="report" id="report">
      <!-- Forecast plot & info will appear here -->
    </div>
  </div>

  <script>
    async function predictSkill() {
      const skill = document.getElementById('skillSelect').value;
      const reportDiv = document.getElementById('report');
      const loadingDiv = document.getElementById('loading');
      reportDiv.innerHTML = '';
      loadingDiv.style.display = 'block';

      try {
        const response = await fetch(`/predict?skill=${encodeURIComponent(skill)}`);
        const data = await response.json();

        loadingDiv.style.display = 'none';

        if(data.error) {
          reportDiv.innerHTML = `<p style="color:red">${data.error}</p>`;
          return;
        }

        // Show basic info
        let html = `<h2>${data.skill}</h2>`;
        html += `<p>Historical points: ${data.history_len}</p>`;
        html += `<p>Peak index: ${data.peak.toFixed(2)}</p>`;
        html += `<p>Obsolescence threshold: ${data.threshold.toFixed(2)}</p>`;
        html += `<p>${data.obsolescence_msg}</p>`;

        // Show plot
        html += `<img src="data:image/png;base64,${data.plot_base64}" alt="Skill Trend Plot">`;

        reportDiv.innerHTML = html;

      } catch (err) {
        loadingDiv.style.display = 'none';
        reportDiv.innerHTML = `<p style="color:red">Error fetching data</p>`;
      }
    }
  </script>
</body>
</html>
